<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <radialGradient id="bg" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#141a24" />
      <stop offset="100%" stop-color="#090c10" />
    </radialGradient>
    <linearGradient id="metal" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#98a0ae" />
      <stop offset="50%" stop-color="#ece6d6" />
      <stop offset="100%" stop-color="#4a5568" />
    </linearGradient>
    <linearGradient id="gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fff3c0" />
      <stop offset="60%" stop-color="#f2c14e" />
      <stop offset="100%" stop-color="#c69224" />
    </linearGradient>
  </defs>
  <!-- Circular shield background -->
  <circle cx="32" cy="32" r="30" fill="url(#bg)" stroke="#7fd4ff" stroke-width="2.5" />
  <circle cx="32" cy="32" r="26" fill="none" stroke="#2a3342" stroke-width="1.5" />
  
  <!-- Thunder lightning runes -->
  <path d="M12 28 L20 28 L15 42 L25 42 L16 54" fill="none" stroke="#7fd4ff" stroke-width="1.5" stroke-linecap="round" opacity="0.6" />
  <path d="M52 28 L44 28 L49 42 L39 42 L48 54" fill="none" stroke="#7fd4ff" stroke-width="1.5" stroke-linecap="round" opacity="0.6" />

  <!-- Hammer Handle -->
  <rect x="29" y="24" width="6" height="30" rx="3" fill="#6a452a" stroke="#3b2314" stroke-width="1" />
  <!-- Leather wrap bands -->
  <line x1="29" y1="32" x2="35" y2="34" stroke="#c69224" stroke-width="1.2" />
  <line x1="29" y1="38" x2="35" y2="40" stroke="#c69224" stroke-width="1.2" />
  <line x1="29" y1="44" x2="35" y2="46" stroke="#c69224" stroke-width="1.2" />
  <!-- Pommel -->
  <circle cx="32" cy="54" r="4" fill="url(#gold)" />

  <!-- War Hammer Head -->
  <rect x="15" y="12" width="34" height="18" rx="3" fill="url(#metal)" stroke="#2a3342" stroke-width="1.5" />
  <!-- Golden runic inlay on hammer face -->
  <rect x="18" y="15" width="28" height="12" rx="2" fill="none" stroke="url(#gold)" stroke-width="1.2" />
  <polygon points="32,16 35,21 32,26 29,21" fill="#7fd4ff" />
</svg>
